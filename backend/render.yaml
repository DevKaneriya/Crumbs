services:
  # Django Web Service
  - type: web
    name: crumbs-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn main.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crumbs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: USE_REAL_EMAIL
        value: False
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RUN_CELERY_SYNC
        value: False

  # Celery Worker Service
  - type: worker
    name: crumbs-celery-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A main worker --loglevel=info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crumbs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: crumbs-redis
          type: redis
          property: connectionString
      - key: USE_REAL_EMAIL
        value: False
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RUN_CELERY_SYNC
        value: False

databases:
  # PostgreSQL Database
  - name: crumbs-db
    databaseName: crumbs_db
    user: crumbs_user
    plan: free
    region: oregon

# Redis Instance
services:
  - type: redis
    name: crumbs-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
